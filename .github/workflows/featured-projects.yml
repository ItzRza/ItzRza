name: Update Featured Projects

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches:
      - main
    paths:
      - README.md

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Regenerate featured projects table
        uses: actions/github-script@v7
        with:
          script: |
            const START = '<!-- featured:projects:start -->';
            const END   = '<!-- featured:projects:end -->';

            const { data: repos } = await github.rest.repos.listForUser({
              username: context.repo.owner,
              type: 'owner',
              per_page: 100,
            });

            // Self (profile repo), archived and forked repos are skipped.
            const list = repos
              .filter(r => r.name !== context.repo.repo && !r.archived && !r.fork)
              .sort((a, b) =>
                (b.stargazers_count - a.stargazers_count) ||
                (b.forks_count - a.forks_count) ||
                (new Date(b.pushed_at) - new Date(a.pushed_at)) ||
                a.name.localeCompare(b.name)
              );

            const clean = s => (s || '').replace(/\|/g, '\\|').replace(/\r?\n/g, ' ').trim();

            const rows = [
              '| Project | Description | Stack | Stars |',
              '|:---|:---|:---|:---|',
            ];
            for (const r of list) {
              const desc = clean(r.description) || '_No description yet_';
              const lang = r.language ? '`' + r.language + '`' : '—';
              rows.push(`| **[${r.name}](${r.html_url})** | ${desc} | ${lang} | ⭐ ${r.stargazers_count} |`);
            }
            const block = rows.join('\n');

            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'README.md',
            });
            const content = Buffer.from(file.content, 'base64').toString('utf8');

            const si = content.indexOf(START);
            const ei = content.indexOf(END);
            if (si === -1 || ei === -1 || ei < si) {
              core.setFailed('Featured projects markers not found in README.md');
              return;
            }

            const next = content.slice(0, si + START.length) + '\n' + block + '\n' + content.slice(ei);
            if (next === content) {
              core.info('README.md already up to date (' + list.length + ' projects)');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'README.md',
              message: 'chore: refresh featured projects',
              content: Buffer.from(next, 'utf8').toString('base64'),
              sha: file.sha,
            });
            core.info('README.md updated with ' + list.length + ' projects');
